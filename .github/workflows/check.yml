name: Website checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27117:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_api.py -q
      - run: npm install --global npm@11
      - run: npm ci
        working-directory: frontend
      - run: python scripts/check_frontend_lock.py
      - run: npm run lint && npm test && npm run test:build && npm run build
        working-directory: frontend
      - name: Check raw public HTML responses
        run: |
          npm run preview --prefix frontend > /tmp/hianzy-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then break; fi
            sleep 1
          done
          python scripts/check_raw_metadata.py

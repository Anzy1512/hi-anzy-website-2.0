# Amplify Hosting build spec.
#
# Uses the monorepo `applications`/`appRoot` format because the app lives in
# frontend/, not the repo root. With appRoot: frontend, Amplify runs every
# command from inside frontend/ and resolves artifact paths relative to it —
# so each path below matches vercel.json's frontend service 1:1.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # Node >=22.14.0 is required (engines field in frontend/package.json).
            # Amplify build images ship nvm; install v22 if it is not already active.
            - nvm install 22
            - nvm use 22
            - node --version
            - npm ci
        build:
          commands:
            # npm run build triggers the npm lifecycle hooks automatically:
            #   prebuild  → check:opacity, check:seo, sitemap
            #   build     → vite build --configLoader native
            #   postbuild → prerender-metadata.cjs (writes 76 prerendered HTML pages + 404.html)
            - npm run build
            # Build-time content dependency (docs/ADR-002): prerender and sitemap
            # fetch /api/case-studies and /api/insights from REACT_APP_BACKEND_URL
            # while this command runs. If the API is unreachable the build still
            # succeeds — silently — on the checked-in scripts/content-snapshot.json
            # and the previous public/sitemap.xml. Deploy the API before building
            # the site, and read this build's log: it must contain
            #   "metadata: generated 76 public HTML pages"
            # and must NOT contain "using the checked-in public content snapshot"
            # or "[API unreachable — database-backed pages omitted]".
      artifacts:
        baseDirectory: build
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*

# Environment variables to set in the Amplify Console under
# App settings → Environment variables. Never commit values here.
#
#   AMPLIFY_MONOREPO_APP_ROOT=frontend
#     REQUIRED. AWS requires this to equal the appRoot above. The Console sets
#     it automatically when you specify the app root while first connecting the
#     repo, but it must be set by hand for an app that already exists or is
#     created via CloudFormation. The build fails without it.
#
#   REACT_APP_BACKEND_URL=<API origin>
#     The public origin of the App Runner service — https://api.hianzy.com once
#     that custom domain is attached (docs/ADR-002 attaches it before the first
#     site build); no path, no trailing slash. vite.config.mjs declares
#     envPrefix: ['VITE_', 'REACT_APP_'], so this existing variable name reaches
#     the bundle with no code change, and scripts/prerender-metadata.cjs and
#     scripts/generate-sitemap.js read the same variable at build time. Leave it
#     unset for same-origin local/Docker development.
#
#   LOCAL_API_URL
#     Must NOT be set here. prerender-metadata.cjs prefers it over
#     REACT_APP_BACKEND_URL (and generate-sitemap.js prefers the reverse), so a
#     stray value would prerender from a different API than the bundle calls.
#
#   SITE_URL=https://hianzy.com
#     Optional — already the default in both build scripts. It is the canonical
#     and og:url origin written into every prerendered page and the sitemap, so
#     it stays the production origin even while the site is only reachable on
#     its temporary *.amplifyapp.com URL.
#
# Rewrites and redirects (Console → App settings → Rewrites and redirects):
# exactly one rule, source `/<*>`, target `/index.html`, type `404-200`. It
# rewrites only when no real file exists, so the prerendered pages and
# sitemap.xml are served first. Do NOT add Amplify's generic SPA regex rule
# (type 200): it matches every extensionless path and would shadow every
# prerendered page while the site still looks correct. See docs/ADR-002 and
# AWS_PREP.md §B3 for the view-source launch gate.
#
# Legacy URLs (docs/IA_CONSOLIDATION_AUDIT.md): the nine standalone pages
# absorbed into their hubs must answer 301 to the section that took them in.
# Add these nine rules ABOVE the 404-200 rule, in this order:
#   /work/built-here            -> /work#built-here                    301
#   /work/built-together        -> /work#built-together                301
#   /network/collaborators      -> /network#collaborators              301
#   /network/artists-creators   -> /network#creators                   301
#   /network/venue-partners     -> /network#venues                     301
#   /network/partners           -> /network#partners                   301
#   /collaborate                -> /network#collaborate                301
#   /careers                    -> /network#careers                    301
#   /who-we-work-with           -> /why-hi-anzy#who-we-work-with       301
# AMPLIFY HASH REDIRECT — REQUIRES LIVE AWS VERIFICATION: whether Amplify
# keeps the "#section" part of a redirect target is not proven in this
# repository. Test all nine on the temporary Amplify hostname before any DNS
# change (AWS_PREP.md §B3). nginx in the Docker image and the in-app router
# are verified to keep the fragment; Amplify is not.

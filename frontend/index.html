<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#E0D8C1" />
    <meta name="description" content="hiAnzy: Business Systems & Transformation Consultancy." />
    <!-- Fonts are self-hosted (public/fonts.css + public/fonts/*.woff2) — this
         used to be two links out to fonts.googleapis.com/fonts.gstatic.com,
         which cost a DNS + TLS round trip before a single glyph could paint.
         A plain <link>, not a src/ import: CRA's css-loader resolves a bare
         url(/fonts/...) inside an imported stylesheet as a webpack module
         path and fails the build, not a browser URL. See
         scripts/fetch-fonts.py to regenerate if the weight list changes. -->
    <!-- .font-display (every heading on every page, including the hero H1
         that paints first) is this one file. Without the preload, the
         browser only learns it exists once it has downloaded and parsed
         fonts.css below — a full extra round trip before the file most
         likely to gate first paint even starts fetching. font-display: swap
         in fonts.css already prevents invisible text while it loads; this
         just makes the wait shorter. Not preloading the other 21 files is
         deliberate: they cover secondary weights/styles, so preloading them
         too would compete with this one for the same early bandwidth. -->
    <link rel="preload" href="/fonts/rajdhani-600-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts.css" />
    <!-- Runs before first paint so a night-mode visitor never sees a paper
         flash. External, not inline: the CSP is script-src 'self' with no
         unsafe-inline, and an inline block is refused. -->
    <script src="/theme-boot.js"></script>
    <title>hiAnzy | From ABC to ROI</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
